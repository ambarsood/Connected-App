services:
  server:
    build:
      context: ./server
    container_name: couple-wishlist-server
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
      - FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
      - FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      - FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build:
      context: ./client
    container_name: couple-wishlist-client
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  client_node_modules:
  server_node_modules:
